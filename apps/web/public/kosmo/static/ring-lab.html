<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Lab</title>
<!-- Ring Lab: a ringed planet with the focus kept in planet-centred metres (double precision), so the camera can go from the whole
     system down to individual ring particles. The main Kosmographica focus is an absolute galactic coordinate (~65 km resolution),
     which is too coarse for that; this page exists to exercise the near-camera particle tier of ring-system.js. -->
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<style>
  :root { --bg: #05060a; --fg: #d9dde6; --dim: #8a93a6; --line: #26304a; --acc: #9fb8ab; --panel: rgba(12, 15, 24, 0.82); }
  @media (prefers-color-scheme: light) { :root { --bg: #05060a; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 12px; width: min(340px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud h1 { font-size: 13px; margin: 0 0 6px; letter-spacing: .04em; text-transform: uppercase; color: var(--acc); }
  #hud .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  #hud button, #hud select { background: #141a2b; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
  #hud button:hover { border-color: var(--acc); }
  #hud label { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  #hud input[type=range] { flex: 1; }
  #stat { color: var(--dim); font-variant-numeric: tabular-nums; white-space: pre-line; margin-top: 6px; }
  #hint { position: fixed; right: 12px; bottom: 10px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>Ring Lab</h1>
  <div class="row"><select id="body"><option>Saturn</option><option>Uranus</option><option>Neptune</option><option>Jupiter</option></select></div>
  <div class="row" id="presets"></div>
  <label>Sun elevation <input id="sunEl" type="range" min="-60" max="60" value="25"><span id="sunElV"></span></label>
  <label>Sun azimuth <input id="sunAz" type="range" min="0" max="360" value="40"></label>
  <label>Clock speed <input id="speed" type="range" min="0" max="4" step="1" value="0"><span id="speedV">paused</span></label>
  <label>Exposure <input id="expo" type="range" min="0.4" max="3" step="0.05" value="1"></label>
  <div id="stat"></div>
</div>
<div id="hint">drag: look · wheel: zoom · W A S D Q E: move</div>
<script type="module">
import * as THREE from 'three';
import { createModel } from './kosmo-models.js';

const BODIES = { Saturn: { r: 58232e3, m: 5.6834e26 }, Uranus: { r: 25362e3, m: 8.681e25 }, Neptune: { r: 24622e3, m: 1.02413e26 }, Jupiter: { r: 69911e3, m: 1.8982e27 } };
// label, radius in the ring plane (km), azimuth (deg), height above the plane (km), camera elevation (rad), view width (m)
const PRESETS = {
  Saturn: [['Whole system', 0, 0, 0, 0.5, 4.2e8], ['C ring', 8.2e4, 20, 0.3, 0.12, 4000], ['B ring', 1.05e5, 40, 0.3, 0.12, 4000], ['Cassini Division', 1.2e5, 40, 0.3, 0.1, 4000], ['A ring · wakes', 1.3e5, 60, 0.35, 0.12, 400], ['Encke gap · Pan', 1.3358e5, 80, 0.25, 0.1, 4000], ['Keeler gap', 1.3650e5, 80, 0.2, 0.08, 4000], ['F ring', 1.4018e5, 100, 0.2, 0.1, 4000]],
  Uranus: [['Whole system', 0, 0, 0, 0.5, 1.9e8], ['Epsilon ring', 5.1149e4, 20, 0.2, 0.1, 400]],
  Neptune: [['Whole system', 0, 0, 0, 0.5, 1.8e8], ['Adams ring arcs', 6.2933e4, 20, 0.15, 0.1, 400]],
  Jupiter: [['Whole system', 0, 0, 0, 0.5, 5e8], ['Main ring', 1.26e5, 20, 0.15, 0.1, 400]],
};
const canvas = document.getElementById('c'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setClearColor(0x05060a);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 1, 1e-3, 1e8);
const st = { body: 'Saturn', model: null, view: 4.2e8, focus: new THREE.Vector3(), yaw: 0.6, pitch: 0.5, sunEl: 25, sunAz: 40, sim: 8.1e8, speed: 0 };
const SPEEDS = [[0, 'paused'], [1, '1×'], [60, '1 min/s'], [3600, '1 h/s'], [86400, '1 day/s']];

function load(name) {
  if (st.model) { scene.remove(st.model); st.model.dispose?.(); }
  const b = BODIES[name]; st.body = name;
  st.model = createModel(THREE, { name, type: 'planet', radius_m: b.r, mass_kg: b.m }); scene.add(st.model);
  st.model.userData.rings.setPole(new THREE.Vector3(0, 1, 0));   // ring plane = the XZ plane
  const P = document.getElementById('presets'); P.innerHTML = '';
  for (const q of PRESETS[name]) { const btn = document.createElement('button'); btn.textContent = q[0]; btn.onclick = () => preset(q[0]); P.appendChild(btn); }
  preset('Whole system');
}
function preset(label) {
  const [, rKm, deg, hKm, el, view] = PRESETS[st.body].find(q => q[0] === label), t = deg * Math.PI / 180;
  st.focus.set(Math.cos(t) * rKm * 1000, hKm * 1000, -Math.sin(t) * rKm * 1000); st.pitch = el; st.view = view;
}
document.getElementById('body').onchange = e => load(e.target.value);
load('Saturn');

// input
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointermove', e => { if (!drag) return; st.yaw -= (e.clientX - drag.x) * 0.005; st.pitch = Math.max(-1.55, Math.min(1.55, st.pitch + (e.clientY - drag.y) * 0.005)); drag = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('wheel', e => { e.preventDefault(); st.view = Math.max(8, Math.min(2e10, st.view * Math.exp(e.deltaY * 0.0015))); }, { passive: false });
const keys = new Set(); addEventListener('keydown', e => keys.add(e.key.toLowerCase())); addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
const $ = id => document.getElementById(id);
$('sunEl').oninput = e => { st.sunEl = +e.target.value; }; $('sunAz').oninput = e => { st.sunAz = +e.target.value; };
$('speed').oninput = e => { const s = SPEEDS[+e.target.value]; st.speed = s[0]; $('speedV').textContent = s[1]; };
$('expo').oninput = e => st.model.userData.rings.setExposure(+e.target.value);

const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3(), sun = new THREE.Vector3();
let last = performance.now(), statT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const w = innerWidth, h = innerHeight; if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  st.sim += st.speed * dt;
  // camera: unit distance from the origin, looking at it; the world moves under it (scale k scene units per metre)
  const k = 2 / st.view, cp = Math.cos(st.pitch), dir = tmp.set(Math.sin(st.yaw) * cp, Math.sin(st.pitch), Math.cos(st.yaw) * cp);
  camera.position.copy(dir); camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);
  fwd.copy(dir).negate(); fwd.y = 0; fwd.normalize(); right.crossVectors(fwd, up).normalize();
  const sp = st.view * 0.6 * dt;
  if (keys.has('w')) st.focus.addScaledVector(fwd, sp); if (keys.has('s')) st.focus.addScaledVector(fwd, -sp);
  if (keys.has('d')) st.focus.addScaledVector(right, sp); if (keys.has('a')) st.focus.addScaledVector(right, -sp);
  if (keys.has('e')) st.focus.y += sp; if (keys.has('q')) st.focus.y -= sp;
  const m = st.model, R = BODIES[st.body].r;
  m.scale.setScalar(R * k); m.position.copy(st.focus).multiplyScalar(-k);
  const el = st.sunEl * Math.PI / 180, az = st.sunAz * Math.PI / 180;
  sun.set(Math.cos(el) * Math.cos(az), Math.sin(el), -Math.cos(el) * Math.sin(az)); if (m.userData.lightDir) m.userData.lightDir.copy(sun);
  m.userData.rings.setSimSeconds(st.sim); m.tick(now / 1000);
  renderer.render(scene, camera);
  if (now - statT > 250) {
    statT = now; const d = m.userData.rings.debug(), alt = Math.abs(st.focus.y), rr = Math.hypot(st.focus.x, st.focus.z) / 1000;
    $('stat').textContent = `view ${fmt(st.view)} across · focus r = ${rr.toFixed(0)} km, ${fmt(alt)} above the plane\nparticle classes in range: ${d.active.split('').map((c, i) => c === '1' ? ['1.2cm', '2.5cm', '5cm', '10cm', '20cm', '40cm', '0.8m', '1.6m', '3.2m', '6.4m'][i] : '').filter(Boolean).join(' ') || 'none (disc only)'}`;
    $('sunElV').textContent = st.sunEl + '°';
  }
}
const fmt = x => x >= 1e6 ? (x / 1e3).toExponential(2) + ' km' : x >= 1e3 ? (x / 1e3).toFixed(2) + ' km' : x.toFixed(1) + ' m';
requestAnimationFrame(frame);
window.ringLab = { st, preset, THREE, scene, camera, renderer };
</script>
</body>
</html>
