<!doctype html>
<html lang="en">
<head>
<script>if (window.top !== window.self) document.documentElement.classList.add("embedded");</script>
<script src="kosmo-theme.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Lab</title>
<link rel="stylesheet" href="flight-ui.css">
<style>
  /* The shell: a mode rail, the vehicle bar, and the lab frame (see FLIGHT-LAB.md). Dark, like the rest of the Kosmographica pages. */
  :root { --bg: #0d0d0d; --text: #dbe5f3; --muted: #8a9bb8; --accent: #7fc3ff; --line: rgba(140,170,220,0.18); --bar: rgba(16,22,32,0.6);
          --ok: #bff0cf; --bad: #ffc2b8; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; min-width: 0; }
  button:focus-visible, [role=tab]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* the top row: brand, the mode rail, the hint */
  #top { flex: none; position: relative; z-index: 5; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 4px 14px; background: rgba(13,13,13,0.96); border-bottom: 1px solid var(--line); }
  #top .brand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: 0.28em; text-transform: uppercase; font-size: 14px; color: #fff; white-space: nowrap; }
  #top #hint { margin-left: auto; font-size: 12px; color: var(--muted); max-width: 46ch; text-align: right; }
  #bar { flex: 1 1 auto; min-width: 0; display: flex; justify-content: flex-start; pointer-events: auto; }
  #bar .rail { display: flex; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; justify-content: space-between; gap: 2px; padding: 3px 4px; }
  #bar .rail .mtab { display: inline-flex; align-items: center; gap: 4px; min-width: 0; height: 30px; padding: 0 7px; border: 0; border-radius: 999px; background: transparent; box-shadow: none;
    color: #b9c6da; font: 500 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.02em; white-space: nowrap; cursor: pointer; }
  #bar .rail .mtab:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #bar .rail .mtab.on { background: rgba(127,195,255,0.24); color: #fff; }
  #bar .rail .mtab[aria-disabled="true"] { opacity: 0.42; cursor: default; }
  #bar .rail .mtab[aria-disabled="true"]:hover { background: transparent; color: #b9c6da; }
  #bar .rail .mtab .ric { width: 16px; height: 16px; flex: none; }
  #bar .rail .mtab .l-l { display: none; }
  /* tooltips open below the rail (the flight-ui tooltip opens above, which would leave the frame) */
  #bar .rail .mtab[data-tip]::after { bottom: auto; top: calc(100% + 8px); transform: translate(-50%, -4px); }
  #bar .rail .mtab[data-tip]:hover::after, #bar .rail .mtab[data-tip]:focus-visible::after { transform: translate(-50%, 0); }

  /* the vehicle bar: visible in every mode */
  #vbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 14px; background: var(--bar); border-bottom: 1px solid var(--line); position: relative; }
  .vb-id { display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
  .vb-kicker { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .vb-name { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  .vb-meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip-wrap { flex: 1 1 340px; min-width: 0; }
  .strip-head { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 4px 14px; margin: 0; }
  .strip > div { min-width: 0; }
  .strip dt { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .strip dd { margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vbar[data-tel="stale"] .strip dd { opacity: 0.5; }
  #vbar[data-tel="none"] .strip dd { color: var(--muted); }
  .vb-act { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .vb-act .ab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; white-space: nowrap; }
  .vb-act .ab .ric { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .vb-act .ab.primary { background: rgba(127,195,255,0.24); color: #fff; }
  .vb-act .ab[data-res="ok"] { color: var(--ok); }
  .vb-act .ab[data-res="bad"] { color: var(--bad); }
  #shareOut { flex: 1 1 100%; width: 100%; font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: rgba(255,255,255,0.07); border: 0; border-radius: 10px; padding: 7px 10px; }
  #evt { flex: 1 1 100%; font-size: 12.5px; color: var(--muted); min-height: 0; }
  #evt:empty { display: none; }

  /* the lab frame: fills what is left under the bar */
  #stage { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; overflow: hidden; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }
  #landcard { position: absolute; right: 14px; top: 10px; z-index: 15; width: min(calc(100% - 28px), 380px); max-height: calc(100% - 20px); overflow: auto; padding: 14px 16px; border-radius: 14px;
    background: rgba(12,17,26,0.97); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 12px 36px rgba(0,0,0,0.5); }
  #landcard h2 { margin: 0; font-size: 15px; color: #fff; }
  #landcard .lc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  #landcard .lc-note { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  #landcard dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 13.5px; }
  #landcard dt { color: var(--muted); }
  #landcard dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  #toast { position: absolute; left: 50%; bottom: 14px; z-index: 20; max-width: min(92%, 460px); padding: 9px 14px; border-radius: 12px; background: rgba(10,14,22,0.95);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); color: #e8eef7; font-size: 13.5px; opacity: 0; transform: translate(-50%, 8px); pointer-events: none; transition: opacity .15s ease, transform .15s ease; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* widths: the labels and the brand give way first, the rail never scrolls */
  @media (min-width: 640px) { #bar .rail .mtab .l-s { display: none; } #bar .rail .mtab .l-l { display: inline; } }
  @media (max-width: 599px) { #top .brand { display: none; } #bar .rail .mtab { padding: 0 5px; gap: 3px; font-size: 12px; } #bar .rail .mtab .ric { width: 14px; height: 14px; } }
  @media (max-width: 1023px) { #top #hint { display: none; } }
  @media (max-width: 559px) { .vb-act .al { display: none; } .vb-act .ab { padding: 6px 9px; } .vb-kicker, .strip-head { display: none; } .vb-name { max-width: 100%; } #vbar { gap: 6px 12px; padding: 6px 12px; } .strip { gap: 2px 12px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header id="top">
  <span class="brand">Flight Lab</span>
  <nav id="bar" aria-label="Lab modes"><div class="rail" role="tablist" aria-label="Lab modes" id="modes"></div></nav>
  <span id="hint"></span>
</header>

<section id="vbar" aria-label="Vehicle" data-tel="none">
  <div class="vb-id">
    <span class="vb-kicker">Vehicle</span>
    <span class="vb-name" id="vbName">--</span>
    <span class="vb-meta" id="vbMeta">--</span>
  </div>
  <div class="strip-wrap">
    <div class="strip-head" id="tStatus">Waiting for telemetry</div>
    <dl class="strip" aria-label="Flight status">
      <div><dt>Phase</dt><dd id="sPhase">--</dd></div>
      <div><dt>Mission time</dt><dd id="sT">--</dd></div>
      <div><dt>Altitude</dt><dd id="sAlt">--</dd></div>
      <div><dt>Speed</dt><dd id="sSpeed">--</dd></div>
      <div><dt>Apo / peri</dt><dd id="sApo">--</dd></div>
      <div><dt>Delta-v</dt><dd id="sDv">--</dd></div>
    </dl>
  </div>
  <div class="vb-act">
    <button type="button" class="ab" id="bSave" title="Save this design in this browser" aria-label="Save design"><svg class="ric" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg><span class="al">Save</span></button>
    <button type="button" class="ab" id="bShare" title="Copy a link to this design" aria-label="Share: copy link"><svg class="ric" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12.5l6-3.5M9 11.5l6 3.5M6.5 13.5a2.2 2.2 0 1 0 0-.01M17.5 7a2.2 2.2 0 1 0 0-.01M17.5 18a2.2 2.2 0 1 0 0-.01"/></svg><span class="al">Share</span></button>
    <button type="button" class="ab" id="bExport" title="Download this design as a JSON file" aria-label="Export design as JSON"><svg class="ric" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 14v6h14v-6"/></svg><span class="al">Export</span></button>
    <button type="button" class="ab primary" id="bSend" title="Switch to the Landing lab" aria-label="Send booster to Landing"><svg class="ric" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13M13 6l6 6-6 6"/></svg><span class="al">Send booster to Landing</span></button>
    <button type="button" class="ab" id="lastLand" aria-expanded="false" aria-controls="landcard" title="The last landing that came back from the Landing lab" data-res="">Last landing: none</button>
  </div>
  <input type="text" id="shareOut" readonly hidden aria-label="Design link (copy it)">
  <div id="evt" aria-live="polite"></div>
</section>

<main id="stage">
  <iframe id="f-design" role="tabpanel" aria-labelledby="tab-design" title="Design and launch" data-src="shipyard.html" hidden></iframe>
  <iframe id="f-land" role="tabpanel" aria-labelledby="tab-land" title="Landing" data-src="landing-lab.html" hidden></iframe>
  <iframe id="f-ascent" role="tabpanel" aria-labelledby="tab-ascent" title="Micro Ascent" data-src="micro-ascent/index.html" hidden></iframe>
  <section id="landcard" aria-labelledby="lcTitle" hidden>
    <div class="lc-head"><h2 id="lcTitle">Last landing</h2><button type="button" id="lcClose">Close</button></div>
    <p class="lc-note" id="lcNote"></p>
    <dl id="lcRows"></dl>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
</main>

<script type="module">
import { saveDesign, shareURL, decodeShare, saveLandingResult, loadLandingResult, loadLast, LAST_KEY, LANDING_RESULT_KEY } from './lab-store.js?v=1';
import * as S from './flight-lab-shell.js?v=1';

const $ = id => document.getElementById(id);
const ORIGIN = location.origin;
const embedded = window.top !== window.self;
const FR = {};                                  // frame name (the mode's frame) -> its iframe
for (const m of S.MODES) if (m.frame) FR[m.frame] = $('f-' + m.frame);
const ICON = {
  launch: 'M12 3c3 2 5 5 5 9l-2 3H9l-2-3c0-4 2-7 5-9zM9 15l-2 4 3-1.5M15 15l2 4-3-1.5M12 9.2h.01',
  land: 'M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14',
  orbit: 'M3 12c0-3 4-5 9-5s9 2 9 5-4 5-9 5-9-2-9-5zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5',
  plan: 'M4 18c4-8 12-8 16-14M4 18h16',
  review: 'M4 19V5M4 19h16M8 15l4-4 3 3 5-6',
};
const storage = () => { try { return window.localStorage; } catch { return null; } };
const isTyping = el => !!el && (el.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName));

// ---- the mode rail (ARIA tablist: roving tabindex, arrow keys, Home / End) ----
const rail = $('modes');
const tabs = {};
for (const m of S.MODES) {
  const b = document.createElement('button');
  b.type = 'button';
  b.id = 'tab-' + m.id;
  b.dataset.mode = m.id;
  b.setAttribute('role', 'tab');
  b.className = 'mtab' + (m.soon ? ' soon' : '');
  b.innerHTML = `<svg class="ric" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[m.icon]}"/></svg><span class="l-s">${m.short || m.label}</span><span class="l-l">${m.label}</span>`;
  if (m.soon) {
    b.setAttribute('aria-disabled', 'true');
    b.setAttribute('aria-label', `${m.label}, coming in ${m.soon}`);
    b.dataset.tip = `Coming in ${m.soon}`;
    b.tabIndex = -1;
  } else {
    b.setAttribute('aria-controls', 'f-' + m.frame);
    b.setAttribute('aria-keyshortcuts', m.key);
    b.setAttribute('aria-label', m.long || m.label);
    b.dataset.tip = `${m.long || m.label} (${m.key})`;
  }
  tabs[m.id] = b;
  rail.append(b);
}
const enabledIds = () => S.MODES.filter(m => !m.soon).map(m => m.id);
rail.addEventListener('click', e => {
  const b = e.target.closest('[role=tab]');
  if (b && !b.getAttribute('aria-disabled')) setMode(b.dataset.mode);
});
rail.addEventListener('keydown', e => {
  const ids = enabledIds();
  const cur = ids.indexOf(e.target.closest('[role=tab]')?.dataset.mode);
  if (cur < 0) return;
  let next = null;
  if (e.key === 'ArrowRight') next = ids[(cur + 1) % ids.length];
  else if (e.key === 'ArrowLeft') next = ids[(cur - 1 + ids.length) % ids.length];
  else if (e.key === 'Home') next = ids[0];
  else if (e.key === 'End') next = ids[ids.length - 1];
  if (!next) return;
  e.preventDefault();
  setMode(next);
  tabs[next].focus();
});

// ---- modes ----
let mode = 'design';
let designShare = null;                         // the #design= share string the Design frame opens with
const frameSrc = id => {
  const m = S.modeById(id);
  return id === 'design' && designShare ? `${m.src}#design=${designShare}` : m.src;
};
function updateHash() {
  try { history.replaceState(null, '', S.buildHash(mode, designShare)); } catch {}
  // inside the wiki, the page's own address carries the mode (the wiki's embed frame reads a posted hash)
  if (embedded) { try { window.parent.postMessage({ kosmo: 'hash', h: S.buildHash(mode, null) }, ORIGIN); } catch {} }
}
function setMode(id, { remember = true } = {}) {
  const m = S.modeById(id);
  if (!m || m.soon) return false;
  mode = id;
  if (!FR[id].getAttribute('src')) FR[id].setAttribute('src', frameSrc(id));   // a frame loads the first time its mode is shown
  for (const x of S.MODES) {
    const b = tabs[x.id];
    if (!b || x.soon) continue;
    const on = x.id === id;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
    b.classList.toggle('on', on);
  }
  for (const k of Object.keys(FR)) FR[k].hidden = k !== id;
  $('hint').textContent = m.hint;
  if (remember) S.writeStoredMode(storage(), id);
  updateHash();
  return true;
}

// ---- startup: the route, then the remembered mode ----
const route = S.parseRoute(location.search, location.hash);
designShare = route.design;
let designFromLink = null;                      // the design a link opened with, until the Shipyard writes its own working design
if (designShare) {
  decodeShare(designShare).then(d => { designFromLink = d; renderVehicle(); }).catch(() => { designFromLink = null; });   // the Shipyard reports an invalid link itself
}
setMode(S.resolveMode(route, S.readStoredMode(storage())));

// ---- keyboard: 1, 2, 3 switch modes (in the shell, and in a frame that has the focus) ----
function onKey(e) {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || isTyping(e.target)) return;
  const id = S.modeForKey(e.key);
  if (!id) return;
  e.preventDefault();
  setMode(id);
  if (e.target?.ownerDocument === document) tabs[id].focus();
}
document.addEventListener('keydown', onKey);
for (const k of ['design', 'land', 'ascent']) {
  FR[k].addEventListener('load', () => { try { FR[k].contentWindow.addEventListener('keydown', onKey); } catch {} });
}

// ---- the vehicle bar ----
const currentDesign = () => designFromLink || loadLast();
function renderVehicle() {
  let d = null;
  try { d = currentDesign(); } catch { d = null; }
  const s = S.summarizeDesign(d);
  $('vbName').textContent = s.name;
  $('vbMeta').textContent = d ? `${s.stages} · ${s.prop} propellant` : 'Nothing designed yet';
}

function toast(msg, ms = 5000) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), ms);
}

function saveNow() {
  const d = currentDesign();
  if (!d) return toast('Nothing to save yet: change the design in Design / Launch first.');
  const r = saveDesign(d.name || 'Untitled design', d);
  toast(r.ok ? `Saved "${r.name}" in this browser.` : `Not saved: ${r.error}`);
}

function shareBase() {
  if (embedded) { try { return window.top.location.origin + window.top.location.pathname; } catch {} }
  return location.origin + location.pathname;
}
async function shareNow() {
  const d = currentDesign();
  if (!d) return toast('Nothing to share yet: change the design in Design / Launch first.');
  let link;
  try { link = await shareURL(d, shareBase()); } catch (e) { return toast(`Could not make the link: ${e.message || e}`); }
  const out = $('shareOut');
  try {
    await navigator.clipboard.writeText(link);
    out.hidden = true;
    toast('Link copied. Opening it shows this design.');
  } catch {
    out.value = link;
    out.hidden = false;
    out.focus();
    out.select();
    toast('Copying is blocked here: the link is selected below.', 8000);
  }
}

function exportNow() {
  const d = currentDesign();
  if (!d) return toast('Nothing to export yet: change the design in Design / Launch first.');
  const url = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2) + '\n'], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = S.exportName(d.name);
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Exported ${a.download}.`);
}

// Asks the Shipyard (Design frame) to hand its booster to the Landing Lab, with the real flown state (it answers with 'flightlab:landing', which opens Land).
let sendTimer = 0;
function sendToLanding() {
  const stages = (currentDesign()?.stages) || [];
  let idx = stages.findIndex(s => s && s.landing && s.landing.mode && s.landing.mode !== 'none');
  if (idx < 0) idx = 0;
  const w = FR.design.getAttribute('src') ? FR.design.contentWindow : null;
  clearTimeout(sendTimer);
  if (w) {
    try { w.postMessage({ type: 'flightlab:request-handoff', stage: idx }, ORIGIN); } catch {}
    sendTimer = setTimeout(() => {      // no answer: the Shipyard is still loading or has no such stage
      setMode('land');
      toast('Landing lab open. In Design / Launch, open a booster stage and press "Tune this landing in the Landing Lab" to send its flown state here.', 9000);
    }, 2500);
  } else {
    setMode('land');
    toast('Open Design / Launch first, design and fly a booster, then send it here.', 6000);
  }
}
$('bSave').addEventListener('click', saveNow);
$('bShare').addEventListener('click', shareNow);
$('bExport').addEventListener('click', exportNow);
$('bSend').addEventListener('click', sendToLanding);

// ---- telemetry: the strip and the last event (a stream from the Design and Landing frames) ----
const TEL_CHECK_MS = 1000;
let lastSample = null, lastAt = NaN, lastEvent = '';
function renderStrip() {
  const m = S.stripModel(lastSample);
  $('sPhase').textContent = m.phase;
  $('sT').textContent = m.t;
  $('sAlt').textContent = m.alt;
  $('sSpeed').textContent = m.speed;
  $('sApo').textContent = m.apoPeri;
  $('sDv').textContent = m.dv;
  const stale = S.isStale(lastAt, Date.now());
  $('vbar').dataset.tel = !lastSample ? 'none' : stale ? 'stale' : 'live';
  $('tStatus').textContent = !lastSample ? 'Waiting for telemetry' : stale ? `${m.source}: no update for a while` : `${m.source}: live`;
}
function onTelemetry(data, from) {
  const s = S.validateTelemetry(data);
  if (!s || s.source !== from) return;      // malformed, another version, or a mode from the wrong frame: ignored
  lastSample = s;
  lastAt = Date.now();
  renderStrip();
  if (s.event && s.event !== lastEvent) {
    lastEvent = s.event;
    $('evt').textContent = `Last event: ${s.event}${s.name ? ` (${s.name})` : ''}, ${S.fmtMissionTime(s.t)}`;
  }
}
renderStrip();
setInterval(renderStrip, TEL_CHECK_MS);

// ---- the last landing: the card, kept in sessionStorage through lab-store ----
const landWord = r => (r.ok ? (r.status === 'caught' ? 'Caught' : 'Landed') : 'Failed');
function fmtNum(x, d, unit) { return Number.isFinite(x) ? `${x.toFixed(d)}${unit ? ' ' + unit : ''}` : '--'; }
function renderLanding(r) {
  const chip = $('lastLand');
  const rows = $('lcRows');
  rows.replaceChildren();
  if (!r) {
    chip.textContent = 'Last landing: none';
    chip.dataset.res = '';
    $('lcNote').textContent = 'No landing has come back from the Landing lab in this tab yet.';
    return;
  }
  chip.textContent = `Last landing: ${landWord(r).toLowerCase()}`;
  chip.dataset.res = r.ok ? 'ok' : 'bad';
  $('lcNote').textContent = r.ok ? `${r.stage || 'The booster'} came down.` : (r.reason || 'No touchdown.');
  const items = [
    ['Result', landWord(r)],
    ['Stage', r.stage || '--'],
    ['Touchdown speed', fmtNum(r.touchdownMs, 2, 'm/s')],
    ['Sideways speed', fmtNum(r.lateralMs, 2, 'm/s')],
    ['Tilt', fmtNum(r.tiltDeg, 1, '°')],
    ['Miss distance', fmtNum(r.missM, 1, 'm')],
    ['Propellant left', fmtNum(r.fuelLeftKg, 0, 'kg')],
    ['Flight time', fmtNum(r.timeS, 1, 's')],
    ['Within the limits', r.constraintsOk === null ? '--' : r.constraintsOk ? 'yes' : 'no'],
  ];
  for (const [k, v] of items) {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    rows.append(dt, dd);
  }
}
function setCard(open) {
  $('landcard').hidden = !open;
  $('lastLand').setAttribute('aria-expanded', String(open));
}
$('lastLand').addEventListener('click', () => setCard($('landcard').hidden));
$('lcClose').addEventListener('click', () => { setCard(false); $('lastLand').focus(); });
renderLanding(S.validateLandingResult(loadLandingResult()));
renderVehicle();

// ---- messages from the frames: same origin only, and only from this shell's own frames ----
let pending = null;                              // a booster handed over before the Landing frame was ready
const windows = () => ({ design: FR.design.contentWindow, land: FR.land.contentWindow, ascent: FR.ascent.contentWindow });
addEventListener('message', e => {
  const from = S.frameOfMessage(e, ORIGIN, windows());
  const d = e.data;
  if (!from || !d || typeof d !== 'object') return;
  if (d.type === 'flightlab:ready') {                       // the landing page finished loading
    if (from === 'land' && pending) { FR.land.contentWindow.postMessage(pending, ORIGIN); pending = null; }
    return;
  }
  if (d.type === 'flightlab:landing') {                     // a booster handed over from the Design frame opens in Land
    if (from !== 'design') return;
    clearTimeout(sendTimer);
    const fresh = !FR.land.getAttribute('src');
    setMode('land');
    pending = d;
    if (!fresh) { FR.land.contentWindow.postMessage(pending, ORIGIN); pending = null; }
    return;
  }
  if (d.type === 'flightlab:landing-result') {             // a landing comes back to the Design frame, and to the card
    if (from !== 'land') return;
    try { FR.design.contentWindow?.postMessage(d, ORIGIN); } catch {}
    const r = S.validateLandingResult(d.result);
    if (!r) return;
    saveLandingResult(d.result);
    renderLanding(r);
    toast(`Landing Lab: ${landWord(r).toLowerCase()}${r.ok ? '' : ', see the card for why'}.`);
    return;
  }
  if (d.type === 'flightlab:telemetry') onTelemetry(d, from);
});

// the Shipyard and the Landing lab write their own state to localStorage: keep the bar in step with it
addEventListener('storage', e => {
  if (e.key === LAST_KEY) { designFromLink = null; renderVehicle(); }
  if (e.key === LANDING_RESULT_KEY) renderLanding(S.validateLandingResult(loadLandingResult()));
});
// a shell address with another #design= (typed or pasted) reloads the Design frame with it; a #mode= switches
addEventListener('hashchange', () => {
  const r = S.parseRoute(location.search, location.hash);
  if (r.design && r.design !== designShare) {
    designShare = r.design;
    designFromLink = null;
    if (FR.design.getAttribute('src')) FR.design.setAttribute('src', frameSrc('design'));
    decodeShare(designShare).then(d => { designFromLink = d; renderVehicle(); }).catch(() => {});
  }
  if (r.mode) setMode(r.mode);
});
</script>
