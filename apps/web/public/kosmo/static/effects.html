<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realism effects database</title>
<link rel="stylesheet" href="kosmographica.css">
<style>
:root{--bg:#0d0d0d;--text:#e8e8e6;--dim:#8d8e91;--line:#242527;--mint:#a9c0b4;--amber:#c4a373;--red:#c28181;--blue:#8aa4be}
html,body{background:var(--bg);color:var(--text);margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input,.bar select{background:#161616;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bar input[type=search]{flex:1 1 220px;min-width:160px}
#count{color:var(--dim);margin-left:auto}
.card{border-top:1px solid var(--line);padding:12px 0}
.card summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.card summary::-webkit-details-marker{display:none}
.nm{font-weight:600}
.cat{color:var(--dim);font-size:12px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 8px;white-space:nowrap}
.s-done{color:var(--mint);border-color:var(--mint)}.s-partial{color:var(--amber);border-color:var(--amber)}.s-not-started{color:var(--dim)}
.sc{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
.desc{color:var(--dim);margin:4px 0 0}
.body{margin-top:10px;display:grid;gap:8px}
.body h4{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:500}
.body p,.body ul{margin:2px 0 0}.body ul{padding-left:18px}
code{background:#161616;padding:1px 5px;border-radius:4px;font-size:12px}
a{color:var(--mint)}
</style></head><body><main>
<h1>Realism effects database</h1>
<p class="sub">Every visual effect we want in the atlas to look like real astronomy imagery. Data: <a href="effects.json">effects.json</a> · <a href="effects.README.md">README</a></p>
<div class="bar">
 <input id="q" type="search" placeholder="Search name, description, objects…">
 <select id="cat"><option value="">All categories</option></select>
 <select id="st"><option value="">Any status</option><option>not-started</option><option>partial</option><option>done</option></select>
 <select id="imp"><option value="0">Any impact</option><option value="5">Impact 5</option><option value="4">Impact 4+</option><option value="3">Impact 3+</option></select>
 <select id="sort"><option value="rank">Sort: value (impact² / difficulty)</option><option value="impact">Impact</option><option value="difficulty">Difficulty (easy first)</option><option value="name">Name</option><option value="category">Category</option></select>
 <span id="count"></span>
</div>
<div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=[];
const safe=u=>/^https?:\/\//.test(u)?u:'#';
function card(x){
  const li=a=>a&&a.length?'<ul>'+a.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'<p>-</p>';
  const refs=x.references.length?'<ul>'+x.references.map(r=>`<li><a href="${esc(safe(r.url))}" target="_blank" rel="noopener">${esc(r.title)}</a> <span class="cat">${esc(r.credit)}</span></li>`).join('')+'</ul>':'<p>none opened</p>';
  const sc=x.testScene?`<a href="${esc(safe(x.testScene))}" target="_blank" rel="noopener"><code>${esc(x.testScene)}</code></a>`:'-';
  return `<details class="card"><summary><span class="nm">${esc(x.name)}</span><span class="cat">${esc(x.category)} · ${esc(x.id)}</span><span class="badge s-${esc(x.status)}">${esc(x.status)}</span><span class="sc">impact ${x.impact} · difficulty ${x.difficulty}</span></summary>
  <p class="desc">${esc(x.description)}</p>
  <div class="body"><div><h4>Physics</h4><p>${esc(x.physics)}</p></div>
  <div><h4>Visual signature</h4>${li(x.visualSignature)}</div>
  <div><h4>Objects</h4><p>${esc((x.objects||[]).join(', '))}</p></div>
  <div><h4>Implementation</h4><p>${esc(x.implementationIdeas)}</p></div>
  <div><h4>Engine hooks</h4>${li(x.engineHooks)}</div>
  <div><h4>Depends on</h4><p>${esc((x.dependencies||[]).join(', ')||'-')}</p></div>
  <div><h4>Test scene</h4><p>${sc}</p></div>
  ${x.notes?`<div><h4>Notes</h4><p>${esc(x.notes)}</p></div>`:''}
  <div><h4>References</h4>${refs}</div></div></details>`;
}
function render(){
  const q=$('q').value.toLowerCase().trim(), c=$('cat').value, s=$('st').value, im=+$('imp').value, so=$('sort').value;
  let L=D.filter(x=>(!c||x.category===c)&&(!s||x.status===s)&&x.impact>=im&&(!q||(x.name+' '+x.id+' '+x.description+' '+(x.objects||[]).join(' ')).toLowerCase().includes(q)));
  const key={rank:x=>-(x.impact*x.impact/x.difficulty),impact:x=>-x.impact,difficulty:x=>x.difficulty};
  L.sort(so==='name'?(a,b)=>a.name.localeCompare(b.name):so==='category'?(a,b)=>a.category.localeCompare(b.category)||b.impact-a.impact:(a,b)=>key[so](a)-key[so](b)||b.impact-a.impact);
  $('list').innerHTML=L.map(card).join('')||'<p class="sub">No effects match.</p>';
  $('count').textContent=L.length+' of '+D.length;
}
fetch('effects.json').then(r=>r.json()).then(d=>{D=d;
  [...new Set(d.map(x=>x.category))].sort().forEach(c=>$('cat').insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`));
  render();}).catch(e=>{$('list').textContent='Could not load effects.json: '+e;});
['q','cat','st','imp','sort'].forEach(i=>$(i).addEventListener('input',render));
</script></body></html>
