<style>
  /* Layout only: type, colour and the "no boxes" rule come from kosmographica.css. */

  #tools button { display: flex; align-items: center; justify-content: center; text-align: center; width: 36px; height: 36px; padding: 0; font-size: 17px; line-height: 1; font-weight: 400; text-decoration: none; border: 1px solid var(--line2); background: var(--bg); color: var(--dim); cursor: pointer; }
  #tools button:hover { color: var(--text); }

  #credit { position: absolute; left: 28px; right: 28px; bottom: 38px; font-size: 12.5px; line-height: 1.5; color: var(--dim); display: none; }

  #credit button { font-size: 12.5px; padding: 0 6px; color: var(--mint); }
  #acc { position: absolute; left: 28px; right: 28px; bottom: 72px; font-size: 13px; color: var(--dim); display: none; align-items: center; gap: 6px 16px; flex-wrap: wrap; }
  #acc label { cursor: pointer; display: inline-flex; align-items: center; gap: 7px; color: var(--text); }
  #acc input { margin: 0; width: 14px; height: 14px; accent-color: var(--mint); }
  #hint { position: absolute; left: 28px; bottom: 16px; font-size: 12.5px; color: var(--dim2); pointer-events: none; }
  #nomodel { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--dim); text-align: center; padding: 40px; pointer-events: none; }
  #time { padding: 16px 28px 20px; border-top: 1px solid var(--line); }
  #thead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  #thead .lab { margin: 0; }
  #thead button { font-size: 13px; padding: 0; color: var(--dim); }
  #thead button:hover { color: var(--mint); }
  #tl { position: relative; height: 134px; margin-top: 12px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  #tl.drag { cursor: grabbing; }
  #tl .band { position: absolute; height: 22px; line-height: 22px; padding: 0 6px; border-right: 1px solid var(--bg); font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; pointer-events: none; }
  #tl .band.r0 { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  #tl .span { position: absolute; top: 98px; height: 5px; min-width: 3px; background: var(--mint); pointer-events: none; }

  #desc h1 { font-size: clamp(24px, 2.2vw, 30px); overflow-wrap: anywhere; line-height: 1.2; letter-spacing: .02em; text-transform: none; font-style: normal; margin: 0 0 6px; }
  #desc .au { color: var(--dim); font-size: 15px; }
  #desc p { line-height: 1.6; margin: 0 0 10px; }
  #desc .gen { font-size: 12.5px; color: var(--dim2); }
  #desc h2 { margin: 32px 0 12px; }
  #desc .lab { margin-bottom: 12px; }
  .crumbs { font-size: 14px; line-height: 1.9; }
  .crumbs a { color: var(--dim); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { color: var(--mint); }
  .crumbs b { color: var(--dim2); font-weight: 400; margin: 0 2px; }
  dl.facts { display: grid; grid-template-columns: 118px 1fr; margin: 0; font-size: 14.5px; }
  dl.facts dt, dl.facts dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line); }
  dl.facts dt { color: var(--dim); }
  #slot { height: 150px; width: 100%; border: 1px dashed var(--line2); display: flex; align-items: center; justify-content: center; color: var(--dim2); font-size: 13px; margin: 20px 0 0; }
  #slot img { max-width: 100%; max-height: 100%; }
  .sp { font-size: 14.5px; line-height: 1.8; }
  .sp .x { color: var(--dim2); text-decoration: line-through; text-decoration-color: var(--line2); }
  .ref { font-size: 13px; color: var(--dim); line-height: 1.5; }
  #empty { padding: 40px 28px; color: var(--dim); }
  @media (max-width: 1100px) { #cap { right: 28px; top: 68px; } #app { grid-template-columns: 300px 1fr; } .col:last-child { display: none; } }
</style>

<body>
<div id="app">
  <section class="col" aria-label="Find a dinosaur">
    <div id="find">
      <h1>Dinosaurs</h1>
      <input id="q" type="search" placeholder="Search by name" autocomplete="off" aria-label="Search by name">
      <div id="scope" hidden></div>
      <div class="facet"><p class="lab">Group</p><div class="opts" id="f-group"></div></div>
      <div class="facet"><p class="lab">Time</p><div class="opts" id="f-era"></div></div>
      <div class="facet"><p class="lab">Diet</p><div class="opts" id="f-diet"></div></div>
      <div class="facet"><p class="lab">Habitat</p><div class="opts" id="f-env"></div></div>
      <div class="tog">
        <label><input type="checkbox" id="t-form"> Trace and egg taxa</label>
        <label><input type="checkbox" id="t-inv"> Invalid names</label>
      </div>
    </div>
    <div id="bar"><select id="f-model" aria-label="Model filter"><option value="">All genera</option><option value="real">Real 3D models only</option><option value="stub">Placeholders only (no model)</option></select><span id="count"></span>
      <select id="sort" aria-label="Sort">
        <option value="az">A to Z</option><option value="old">Oldest first</option><option value="new">Youngest first</option><option value="occ">Most fossils</option>
      </select>
    </div>
    <div id="list" tabindex="0" aria-label="Genera"><div id="spacer"></div></div>
  </section>

  <section class="col" aria-label="Model">
    <div id="stage">
      <div id="cap"><h2 id="cap-h">No selection</h2><div class="t" id="cap-t"></div></div>
      <div id="tools">
        <button id="b-spin" title="Auto spin" aria-label="Auto spin">&#8635;</button>
        <button id="b-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="b-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button id="b-wire" title="Wireframe" aria-label="Wireframe">#</button>
        <button id="b-reset" title="Reset view" aria-label="Reset view">&#8634;</button>
      </div>
      <div id="nomodel"></div>
      <div id="acc"></div>
      <div id="credit"></div>
      <div id="hint">Drag to spin, scroll to zoom the model</div>
    </div>
    <div id="time">
      <div id="thead"><p class="lab">Time range, Ma <span class="dim" id="time-t" style="letter-spacing:0;text-transform:none;font-weight:400"></span></p><button id="fit" title="Frame the selected genus">Fit to selection</button></div>
      <div id="tl" aria-label="Time axis. Drag to pan, pinch or scroll to zoom."></div>
    </div>
  </section>

  <section class="col" aria-label="Description"><div id="desc"><div id="empty">Choose a dinosaur from the list.</div></div></section>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => (n >= 100 ? Math.round(n) : Math.round(n * 10) / 10);
const cap1 = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* ------------------------------------------------------------------ data */
const GROUPS = ['Theropoda', 'Sauropodomorpha', 'Thyreophora', 'Ornithopoda', 'Ceratopsia', 'Pachycephalosauria'];
const TEMPLATE = { Theropoda: 'rex', Sauropodomorpha: 'sauro', Thyreophora: 'steg', Ornithopoda: 'tri', Ceratopsia: 'tri', Pachycephalosauria: 'tri' };
const ERAS = [
  { k: 'Triassic', hi: 251.9, lo: 201.4 }, { k: 'Jurassic', hi: 201.4, lo: 145 }, { k: 'Cretaceous', hi: 145, lo: 66 },
];
const byId = new Map(); let genera = [], speciesBy = null, meta = null;
const F = { model: '', q: '', group: null, era: null, diet: null, env: null, clade: null, form: false, inv: false, sort: 'az' };
let view = [], sel = null;

let MODELS = {};
try { MODELS = await (await fetch('dinosaurs/models.json')).json(); } catch (e) { /* no downloaded models yet: templates only */ }
const raw = await (await fetch('dinosaurs/dinosaurs.json')).json();
meta = raw.meta;
for (const t of raw.taxa) byId.set(t.id, t);
for (const t of raw.taxa) {
  if (t.r !== 'genus') continue;
  const anc = []; let p = byId.get(t.p), guard = 0;
  while (p && guard++ < 40) { anc.push(p.id); p = byId.get(p.p); }
  t.anc = anc;
  const names = anc.map((i) => byId.get(i).n);
  t.group = GROUPS.find((g) => names.includes(g)) ?? 'Other';
  t.diets = (t.diet || '').split(',').map((s) => s.trim()).filter(Boolean);
  t.low = (t.n + ' ' + (t.cn || '')).toLowerCase();
  genera.push(t);
}

const eraHit = (t, e) => t.ma && t.ma[1] < e.hi && t.ma[0] > e.lo;
function passes(t, skip) {
  if (F.model === 'real' && !MODELS[t.id]) return false;
  if (F.model === 'stub' && MODELS[t.id]) return false;
  if (!F.form && t.form) return false;
  if (!F.inv && t.inv) return false;
  if (skip !== 'q' && F.q && !t.low.includes(F.q)) return false;
  if (skip !== 'group' && F.group && t.group !== F.group) return false;
  if (skip !== 'era' && F.era && !eraHit(t, ERAS.find((e) => e.k === F.era))) return false;
  if (skip !== 'diet' && F.diet && !t.diets.includes(F.diet)) return false;
  if (skip !== 'env' && F.env && !(t.env || '').split(',').includes(F.env)) return false;
  if (skip !== 'clade' && F.clade && !t.anc.includes(F.clade)) return false;
  return true;
}

/* ---------------------------------------------------------- filter + list */
function facet(id, key, values) {
  const el = $(id), pool = genera.filter((t) => passes(t, key));
  const count = (v) => pool.filter((t) =>
    key === 'group' ? t.group === v : key === 'era' ? eraHit(t, ERAS.find((e) => e.k === v)) : key === 'diet' ? t.diets.includes(v) : (t.env || '').split(',').includes(v)).length;
  el.innerHTML = values.map((v) => `<button data-k="${key}" data-v="${esc(v)}" class="${F[key] === v ? 'on' : ''}">${esc(v)}<small>${count(v).toLocaleString()}</small></button>`).join('');
}
const top = (fn, n) => { const c = {}; genera.forEach((t) => fn(t).forEach((v) => (c[v] = (c[v] || 0) + 1))); return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n).map((e) => e[0]); };
const DIETS = top((t) => t.diets, 6), ENVS = top((t) => (t.env || '').split(',').filter(Boolean), 4);

function apply() {
  view = genera.filter((t) => passes(t));
  const s = F.sort;
  view.sort(s === 'az' ? (a, b) => a.n.localeCompare(b.n)
    : s === 'old' ? (a, b) => (b.ma?.[0] ?? -1) - (a.ma?.[0] ?? -1)
    : s === 'new' ? (a, b) => (a.ma?.[1] ?? 999) - (b.ma?.[1] ?? 999)
    : (a, b) => (b.oc || 0) - (a.oc || 0));
  facet('f-group', 'group', [...GROUPS, 'Other']); facet('f-era', 'era', ERAS.map((e) => e.k));
  facet('f-diet', 'diet', DIETS); facet('f-env', 'env', ENVS);
  const sc = $('scope');
  sc.hidden = !F.clade; if (F.clade) sc.textContent = `Within ${byId.get(F.clade).n}  ×`;
  { const n = Object.keys(MODELS).length, o = $('f-model').options; o[1].textContent = `Real 3D models only (${n})`; o[2].textContent = `Placeholders only (${genera.filter((t) => !t.form && !t.inv).length - n})`; }
  $('count').textContent = `${view.length.toLocaleString()} of ${genera.length.toLocaleString()} genera`;
  $('spacer').style.height = view.length * 54 + 'px';
  $('list').scrollTop = 0; paint();
  if (!view.length) $('spacer').innerHTML = '<div id="none">Nothing matches. Clear a filter to see more.</div>';
}
function rowHtml(t, i) {
  const age = t.ma ? `${fmt(t.ma[0])}–${fmt(t.ma[1])} Ma` : 'age unknown';
  const sub = [t.fam, age, t.diet].filter(Boolean).join(' · ');
  return `<div class="row${sel === t ? ' on' : ''}${t.inv ? ' inv' : ''}" data-i="${i}" style="top:${i * 54}px"><div class="nm">${esc(t.n)}${t.cn ? `<i>${esc(t.cn)}</i>` : ''}${MODELS[t.id] ? '<span class="m3">3D</span>' : ''}</div><div class="sub">${esc(sub)}</div></div>`;
}
function paint() {
  const L = $('list'), first = Math.max(0, Math.floor(L.scrollTop / 54) - 4), last = Math.min(view.length, first + Math.ceil(L.clientHeight / 54) + 9);
  if (!view.length) return;
  let h = ''; for (let i = first; i < last; i++) h += rowHtml(view[i], i);
  $('spacer').innerHTML = h;
}
$('list').addEventListener('scroll', paint);
$('list').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r) select(view[+r.dataset.i]); });
$('list').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return; e.preventDefault();
  const i = Math.max(0, Math.min(view.length - 1, view.indexOf(sel) + (e.key === 'ArrowDown' ? 1 : -1)));
  if (view[i]) { select(view[i]); const L = $('list'), y = i * 54; if (y < L.scrollTop) L.scrollTop = y; else if (y + 54 > L.scrollTop + L.clientHeight) L.scrollTop = y + 54 - L.clientHeight; }
});
$('find').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const k = b.dataset.k; F[k] = F[k] === b.dataset.v ? null : b.dataset.v; apply();
});
$('q').addEventListener('input', (e) => { F.q = e.target.value.trim().toLowerCase(); apply(); });
$('f-model').addEventListener('change', (e) => { F.model = e.target.value; apply(); });
$('t-form').addEventListener('change', (e) => { F.form = e.target.checked; apply(); });
$('t-inv').addEventListener('change', (e) => { F.inv = e.target.checked; apply(); });
$('sort').addEventListener('change', (e) => { F.sort = e.target.value; apply(); });
$('scope').addEventListener('click', () => { F.clade = null; apply(); });

/* ----------------------------------------------------------------- detail */
async function loadSpecies() {
  if (speciesBy) return;
  speciesBy = new Map();
  for (const s of await (await fetch('dinosaurs/dinosaur-species.json')).json()) (speciesBy.get(s.p) ?? speciesBy.set(s.p, []).get(s.p)).push(s);
}
function blurb(t) {
  const bits = [];
  const kind = t.form ? 'a trace or egg taxon (a name for footprints, eggs or other traces rather than a body fossil)' : `${t.diet ? (/^[aeiou]/.test(t.diet) ? 'an ' : 'a ') + t.diet.replace(/, /g, '-eating ').replace(/(.*)/, '$1') : 'a'} dinosaur`;
  bits.push(`<span class="sci">${esc(t.n)}</span> is ${kind}${t.fam ? ` in the family ${esc(t.fam)}` : ''}${t.cn ? `, commonly "${esc(t.cn)}"` : ''}.`);
  if (t.ma) bits.push(`It is known from ${t.from === t.to || !t.to ? esc(t.from || 'an unrecorded interval') : `the ${esc(t.from)} to the ${esc(t.to)}`}, roughly ${fmt(t.ma[0])} to ${fmt(t.ma[1])} million years ago.`);
  if (t.env) bits.push(`Its habitat is recorded as ${esc(t.env)}${t.hab ? `, ${esc(t.hab)}` : ''}.`);
  if (t.oc) bits.push(`The Paleobiology Database holds ${t.oc.toLocaleString()} fossil occurrence${t.oc === 1 ? '' : 's'}.`);
  if (t.inv) bits.push(`This name is currently treated as ${esc(t.inv)}.`);
  return bits.join(' ');
}
async function select(t, fromHash) {
  sel = t;
  if (!fromHash) { history.replaceState(null, '', '#' + t.id); if (window.parent !== window) window.parent.postMessage({ kosmo: 'hash', h: '#' + t.id }, location.origin); } // keeps /kosmo/tools/dinosaurs#<id> shareable
  paint();
  const crumbs = [...t.anc].reverse().filter((i) => !['Chordata', 'Reptilia', 'Vertebrata'].includes(byId.get(i).n))
    .map((i) => `<a data-c="${i}" title="Show every genus in ${esc(byId.get(i).n)}">${esc(byId.get(i).n)}</a>`).join(' <b>›</b> ');
  const rows = [
    ['Rank', cap1(t.r)], ['Named by', t.a], ['Time', t.ma ? `${fmt(t.ma[0])}–${fmt(t.ma[1])} Ma` + (t.from ? ` (${t.from}${t.to && t.to !== t.from ? ' to ' + t.to : ''})` : '') : null],
    ['Fossil records', t.oc != null ? t.oc.toLocaleString() : null], ['Diet', t.diet], ['Habitat', t.env], ['Life habit', t.hab], ['Locomotion', t.mot],
    ['Reproduction', t.repro], ['Preserved as', t.body], ['Type specimen', t.tsp], ['Type body part', t.tpart], ['Status', t.inv ? cap1(t.inv) : 'Valid'],
  ].filter((r) => r[1]).map((r) => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('');
  $('desc').innerHTML = `
    <p class="lab">${esc(t.group)}${t.form ? ' · trace taxon' : ''}</p>
