    <button id="play" title="Play / pause (Space)">Pause</button>
    <button id="replay" title="Replay (R)">↺ Replay</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline scrubber">
    <span class="t" id="time">0.00 / 0.00s</span>
    <label><input type="checkbox" id="loop"> Loop</label>
    <select id="speed" aria-label="Speed">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option>
    </select>
    <button id="prev" title="Previous (↑)">↑</button>
    <button id="next" title="Next (↓)">↓</button>
  </div>
</main>

<script>
/* =========================================================
   Tiny "After Effects" toolkit on top of the Web Animations API
   ========================================================= */
const mk=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const RB=['#ff1f2d','#ff8a00','#ffd21a','#22b800','#00b5ff','#3b2bff','#9b30f0'];
const hasLinear=window.CSS&&CSS.supports&&CSS.supports('animation-timing-function','linear(0,1)');
const SPR=hasLinear?(()=>{const n=56,p=[];for(let i=0;i<=n;i++){const t=i/n;p.push(i===n?1:+(1-Math.exp(-6*t)*Math.cos(t*Math.PI*5)).toFixed(4))}return `linear(${p.join(',')})`})():'cubic-bezier(.34,1.56,.64,1)';
const E={out:'cubic-bezier(.16,1,.3,1)',io:'cubic-bezier(.65,0,.35,1)',back:'cubic-bezier(.34,1.56,.64,1)',in:'cubic-bezier(.7,0,.84,0)',spring:SPR};

let anims=[];
function an(el,kf,o={}){
  if(!el)return;
  const a=el.animate(kf,{duration:o.d||600,delay:o.t||0,easing:o.e||E.out,fill:'both'});
  anims.push(a);return a;
}
const Q=(r,s)=>r.querySelector(s), QA=(r,s)=>[...r.querySelectorAll(s)];

const G=(id,cols=RB,x1=0,y1=0,x2=1,y2=1,units='objectBoundingBox')=>
 `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" gradientUnits="${units}">${cols.map((c,i)=>`<stop offset="${cols.length>1?i/(cols.length-1):0}" stop-color="${c}"/>`).join('')}</linearGradient>`;

/* ---- vector lettering: every wordmark is built from outlined glyph paths (kosmo-glyphs.js) ---- */
const FMAP={serif:['corm',500],f54:['corm',500],thin:['corm',300],geo:['outfit',700],out:['outfit',700],f51:['fraunces',900],f52:['anton'],ant:['anton'],f55:['chango'],bold:['playfair',900],it:['playfair',500,'I'],f30:['playfair',800],f64:['playfair',800],f33:['playfair',900,'I'],cps:['caprasimo'],exo:['exo',900,'I'],exo2:['exo',700],bng:['bungee'],bc:['barlowc',700],bcd:['barlowc',600],orb:['orbitron',700]};
function fkey(cls,style=''){
  const t=cls.split(/\s+/).find(x=>FMAP[x]);if(!t)return 'outfit700';
  const [fam,w,it]=FMAP[t];const m=/font-weight:\s*(\d+)/.exec(style);
  if(m){const k=fam+(it||'')+m[1];if(FONTS[k])return k}
  return fam+(it||'')+(w||'');
}
function glyph(ch,key,prev,extra=''){
  const F=FONTS[key],g=F.g[ch];if(!g)return `<span class="c">${ch}</span>`;
  const k=prev?(F.k[prev+ch]||0):0;
  return `<span class="c g" data-ch="${ch}" style="width:${g[0]/1000}em;${k?`margin-left:${k/1000}em;`:''}${extra}"><svg viewBox="0 -800 ${g[0]} 1000" aria-hidden="true"><path d="${g[1]}"/></svg></span>`;
}
function glyphs(text,key,wrap){let p='';return [...text].map(ch=>{const h=glyph(ch,key,p);p=ch;return wrap?`<span class="m">${h}</span>`:h}).join('')}
function W(text,{cls='',mask=false,style=''}={}){return `<div class="word ${cls}" style="${style}">${glyphs(text,fkey(cls,style),mask)}</div>`}
/* outlined text for use inside <svg>: fits to textLength like SVG text did */
function TP(text,key,{x=0,y=0,size=100,tl=0,anchor='start',cls='',sw=0}={}){
  const F=FONTS[key];let px=0,p='',parts='';
  for(const ch of text){const g=F.g[ch];if(!g)continue;px+=p?(F.k[p+ch]||0):0;parts+=`<path transform="translate(${px} 0)" d="${g[1]}"/>`;px+=g[0];p=ch}
  const s=size/1000,sx=tl?tl/(px*s):1,w=px*s*sx,x0=anchor==='middle'?x-w/2:x;
  return `<g class="${cls}"><g transform="translate(${x0} ${y}) scale(${s*sx} ${s})" style="transform-box:view-box;transform-origin:0 0" fill="currentColor"${sw?` stroke="currentColor" stroke-width="${sw/s}" stroke-linejoin="round"`:''}>${parts}</g></g>`;
}
/* letter-spacing → per-glyph margins (glyph spans have no text, so CSS letter-spacing can't reach them) */
function layoutWords(el){el.querySelectorAll('.c').forEach(c=>{const cs=getComputedStyle(c),ls=parseFloat(cs.letterSpacing),fs=parseFloat(cs.fontSize);if(ls&&fs)c.style.marginRight=(ls/fs)+'em'})}
const track=(r,fromEm,t0,d)=>QA(r,'.word .c').forEach(c=>{const f=c.style.marginRight||'0em';an(c,[{marginRight:fromEm+'em'},{marginRight:f}],{d,t:t0,e:E.out})});
const rise=(els,t0=0,gap=40,o={})=>els.forEach((c,i)=>an(c,[{opacity:0,transform:`translateY(${o.y??22}px)`,filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0px)'}],{d:o.d||700,t:t0+i*gap,e:o.e||E.out}));
const maskRise=(els,t0=0,gap=35,d=800)=>els.forEach((c,i)=>an(c,[{transform:'translateY(115%)'},{transform:'translateY(0)'}],{d,t:t0+i*gap,e:E.out}));
const draw=(el,t,d,e=E.io)=>an(el,[{strokeDashoffset:1,opacity:0},{opacity:1,offset:.03},{strokeDashoffset:0,opacity:1}],{d,t,e});

const LOGOS=[];
const add=(n,name,reveal,build,play)=>LOGOS.push({n,name,reveal,build,play});

/* ---------- 49 Rainbow arc ---------- */
add(49,'Rainbow Arc','Radial draw-on · letter rise',u=>{
  const arcs=RB.map((c,i)=>{const r=128-i*18;return `<path class="arc dr" pathLength="1" d="M${-r} 0 A${r} ${r} 0 0 1 ${r} 0" fill="none" stroke="${c}" stroke-width="18"/>`}).join('');
  return `<div class="logo"><svg width="300" height="144" viewBox="-150 -140 300 142">${arcs}</svg>${W('Kosmographica',{cls:'serif'})}</div>`;
},r=>{
  QA(r,'.arc').forEach((a,i)=>draw(a,i*120,950));
  an(Q(r,'svg'),[{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{d:600,t:1400,e:E.io});
  rise(QA(r,'.c'),950,45);
});

/* ---------- 50 K with rainbow chevrons ---------- */
add(50,'Chevron K','Slide-out chevrons · tracking in',u=>{
  const w=11,dx=w*1.25,start=118+24.4;
  const cols=RB.map((c,i)=>{const x=start+i*dx;return `<path class="cc" d="M${x} 0 L${x-56} 75 L${x} 150" fill="none" stroke="${c}" stroke-width="${w}" stroke-miterlimit="6"/>`}).join('');
  return `<div class="logo"><svg width="260" height="150" viewBox="0 0 250 150">
    <defs><clipPath id="${u}c"><rect width="250" height="150"/></clipPath></defs>
    <g clip-path="url(#${u}c)">${cols}
    <path class="bk" d="M118 0 L62 75 L118 150" fill="none" stroke="#0d0d10" stroke-width="28" stroke-miterlimit="6"/>
    <rect class="stem" x="0" y="0" width="60" height="150" fill="#0d0d10" style="transform-origin:50% 100%"/></g></svg>
    ${W('Kosmographica',{cls:'geo',style:'font-size:58px;margin-top:10px'})}</div>`;
},r=>{
  an(Q(r,'.stem'),[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{d:600,e:E.out});
  an(Q(r,'.bk'),[{transform:'translateX(-60px)',opacity:0},{transform:'none',opacity:1}],{d:600,t:250});
  QA(r,'.cc').forEach((c,i)=>an(c,[{transform:'translateX(-80px)',opacity:0},{transform:'none',opacity:1}],{d:800,t:550+i*90}));
  an(Q(r,'.word'),[{opacity:0},{opacity:1}],{d:1100,t:900});track(r,.4,900,1100);
});

/* ---------- 51 Swash wordmark ---------- */
add(51,'Rainbow Swash','Wipe reveal · swoosh draw-on',u=>
  `<div class="logo">${W('Kosmographica',{cls:'f51'})}
   <svg width="600" height="118" viewBox="0 0 460 90" style="margin-top:-8px"><defs>${G(u+'s',RB,30,0,430,0,'userSpaceOnUse')}</defs>
   <path class="sw dr" pathLength="1" d="M30 62 C20 22 90 18 150 44 C215 72 270 66 320 42 C365 20 420 22 425 50 C428 70 400 80 378 70" fill="none" stroke="url(#${u}s)" stroke-width="15" stroke-linecap="round"/></svg></div>`,
r=>{
  const w=Q(r,'.word');
  an(w,[{clipPath:'inset(-15% 100% -25% 0)',transform:'translateX(-50px)'},{clipPath:'inset(-15% 0% -25% 0)',transform:'none'}],{d:1100,e:E.io});
  QA(r,'.c').forEach((c,i)=>an(c,[{transform:'skewX(-14deg) translateY(10px)'},{transform:'none'}],{d:900,t:i*50}));
  draw(Q(r,'.sw'),700,1300);
});

add(52,'Condensed Bars','Scale slam · color-bar wipe',u=>

r=>{
  QA(r,'.c').forEach((c,i)=>an(c,[{transform:'scaleY(0)',opacity:0},{transform:'scaleY(1.12)',opacity:1,offset:.7},{transform:'scaleY(1)',opacity:1}],{d:650,t:i*45,e:E.out}));
  QA(r,'.bars i').forEach((b,i)=>an(b,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:500,t:700+i*80}));
  an(Q(r,'.bars'),[{filter:'brightness(1)'},{filter:'brightness(1.35)'},{filter:'brightness(1)'}],{d:500,t:1400});
});

add(53,'Block Mark','Shape build · unfold',u=>

   <path class="g1" style="transform-origin:0 100%" d="M104 72 L170 24 L216 52 V150 L150 210 H104Z" fill="url(#${u}a)"/>
   <path class="b2" d="M216 120 V210 H140Z" fill="#0d0d10"/>

   ${W('Kosmographica',{cls:'geo',mask:true,style:'font-size:56px;margin-top:10px;font-weight:600'})}</div>`,
r=>{
  an(Q(r,'.b1'),[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{d:700,e:E.out});
  an(Q(r,'.g2'),[{transform:'scaleY(0)',opacity:0},{transform:'scaleY(1)',opacity:1}],{d:600,t:500});
  an(Q(r,'.g1'),[{transform:'scale(0) rotate(-70deg)',opacity:0},{transform:'none',opacity:1}],{d:900,t:600,e:E.spring});
  an(Q(r,'.b2'),[{transform:'translate(60px,60px)',opacity:0},{transform:'none',opacity:1}],{d:600,t:1100});
  maskRise(QA(r,'.c'),1000);
});

/* ---------- 54 Light serif with spectrum ticks ---------- */
add(54,'Spectrum Ticks','Center-out lines · blur-in tracking',u=>{
  const H=[22,38,56,44,30,40,24];
  const mkS=(top)=>`<svg width="240" height="60" viewBox="0 0 240 60">${RB.map((c,i)=>`<rect class="${top?'tu':'td'}" x="${14+i*34}" y="${top?60-H[i]:0}" width="3.4" height="${H[i]}" fill="${c}" style="transform-origin:50% ${top?'100%':'0%'}"/>`).join('')}</svg>`;
  return `<div class="logo">${mkS(true)}${W('Kosmographica',{cls:'f54'})}${mkS(false)}</div>`;
},r=>{
  [...QA(r,'.tu'),...QA(r,'.td')].forEach((l,k)=>{const i=k%7;an(l,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{d:700,t:Math.abs(i-3)*110+(k>6?60:0),e:E.out})});
  an(Q(r,'.word'),[{opacity:0,filter:'blur(8px)'},{opacity:1,filter:'blur(0)'}],{d:1200,t:500});track(r,.14,500,1200);
});

/* ---------- 55 Groovy ---------- */
add(55,'Groovy Bounce','Drop · squash & stretch · hue ramp',u=>{
  const t='Kosmographica';
  return `<div class="logo"><div class="word f55">${[...t].map((ch,i)=>glyph(ch,'chango',t[i-1],`color:hsl(${Math.round(i/(t.length-1)*285)} 95% 52%)`)).join('')}</div></div>`;
},r=>{
  QA(r,'.c').forEach((c,i)=>{const s=i%2?1:-1;an(c,[
    {transform:'translateY(-220px) scale(.6,1.5) rotate(-25deg)',opacity:0},
    {transform:'translateY(0) scale(1.3,.7) rotate(0)',opacity:1,offset:.55},
    {transform:'translateY(-14px) scale(.92,1.1) rotate(2deg)',opacity:1,offset:.78},
    {transform:`translateY(${s*-4}px) rotate(${s*3}deg)`,opacity:1}],{d:1000,t:i*70,e:E.io})});
});

/* ---------- 56 Serif K with petals ---------- */
add(56,'Petal K','Stroke build · bloom',u=>
  `<div class="logo"><svg width="220" height="220" viewBox="0 0 220 220"><defs>
   ${G(u+'p1',['#ff1f2d','#ff8a00','#ffd21a'],0,1,0,0)}${G(u+'p2',['#22b800','#00b5ff','#3b2bff'],0,0,0,1)}${G(u+'p3',['#3b2bff','#9b30f0','#ff3fa0'],0,0,1,1)}</defs>
   <g fill="#0d0d10">
    <rect class="stem" style="transform-origin:50% 0" x="62" y="22" width="30" height="176"/>
    <rect class="sf" x="30" y="14" width="64" height="12"/><rect class="sf" x="30" y="194" width="64" height="12"/>
    <path class="arm dr" pathLength="1" d="M92 118 L150 30" fill="none" stroke="#0d0d10" stroke-width="24"/><rect class="sf" x="128" y="14" width="76" height="12"/>
    <path class="arm dr" pathLength="1" d="M104 100 L162 198" fill="none" stroke="#0d0d10" stroke-width="26"/><rect class="sf" x="136" y="194" width="74" height="12"/></g>
   <path class="pt" style="transform-origin:90% 100%" d="M92 120 C70 90 74 50 100 34 C112 66 108 96 92 120Z" fill="url(#${u}p1)"/>
   <path class="pt" style="transform-origin:90% 0%" d="M90 126 C72 140 72 170 92 190 C108 168 108 144 90 126Z" fill="url(#${u}p2)"/>
   <path class="pt" style="transform-origin:0% 50%" d="M112 128 C124 120 146 130 150 150 C130 156 116 148 112 128Z" fill="url(#${u}p3)"/></svg>
   ${W('Kosmographica',{cls:'serif',style:'font-size:52px;margin-top:2px'})}</div>`,
r=>{
  an(Q(r,'.stem'),[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{d:600});
  QA(r,'.sf').forEach((s,i)=>an(s,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:450,t:350+i*120}));
  QA(r,'.arm').forEach((a,i)=>draw(a,300+i*250,700,E.out));
  QA(r,'.pt').forEach((p,i)=>an(p,[{transform:'scale(0) rotate(-40deg)',opacity:0},{transform:'none',opacity:1}],{d:1100,t:800+i*180,e:E.spring}));
  rise(QA(r,'.c'),1300,40);
});

/* ---------- 57 Squares ---------- */
add(57,'Pixel Dots','Mask rise · pop & wave',u=>
  `<div class="logo">${W('Kosmographica',{cls:'geo',mask:true,style:'font-size:68px'})}<div class="sq">${RB.map(c=>`<i style="background:${c}"></i>`).join('')}</div></div>`,
r=>{
  maskRise(QA(r,'.c'),0,35);
  const s=QA(r,'.sq i');
  s.forEach((q,i)=>an(q,[{transform:'scale(0)'},{transform:'scale(1)'}],{d:900,t:550+i*80,e:E.spring}));
  s.forEach((q,i)=>an(q,[{transform:'translateY(0)'},{transform:'translateY(-10px)'},{transform:'translateY(0)'}],{d:420,t:1500+i*70,e:E.io}));
});

/* ---------- 58 Ribbon S ---------- */
add(58,'Ribbon','Ribbon unfurl · mask rise',u=>
  `<div class="logo"><svg width="220" height="230" viewBox="-20 0 240 240"><defs>${G(u+'g',RB.slice(0,6).reverse().map((c,i,a)=>a[a.length-1-i]),0,20,0,215,'userSpaceOnUse')}</defs>
   <path class="rb dr" pathLength="1" d="M150 24 L40 66 L150 132 L40 200" fill="none" stroke="url(#${u}g)" stroke-width="40" stroke-linejoin="miter" stroke-miterlimit="4"/></svg>
   ${W('Kosmographica',{cls:'geo',mask:true,style:'font-size:52px;font-weight:500;margin-top:8px'})}</div>`,
r=>{
  draw(Q(r,'.rb'),0,1500);
  an(Q(r,'svg'),[{transform:'rotate(-6deg)'},{transform:'rotate(0)'}],{d:1500,e:E.out});
  maskRise(QA(r,'.c'),1000,35);
});

/* ---------- 59 Thin / bold ---------- */
add(59,'Thin + Bold','Converge · underline sweep',u=>
  `<div class="logo"><div class="row"><span class="thin">${glyphs('Kosmo','corm300')}</span><span class="bold">${glyphs('graphica','playfair900')}</span></div><div class="line59"></div></div>`,
r=>{
  an(Q(r,'.thin'),[{transform:'translateX(-120px)',opacity:0,filter:'blur(10px)'},{transform:'none',opacity:1,filter:'blur(0)'}],{d:1000});
  an(Q(r,'.bold'),[{transform:'translateX(120px)',opacity:0,filter:'blur(10px)'},{transform:'none',opacity:1,filter:'blur(0)'}],{d:1000});
  an(Q(r,'.line59'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:900,t:700,e:E.io});
  an(Q(r,'.line59'),[{filter:'hue-rotate(0)'},{filter:'hue-rotate(40deg) saturate(1.4)'},{filter:'hue-rotate(0)'}],{d:700,t:1700,e:E.io});
});

add(60,'Swirl Orb','Spin-scale pop · swirl draw',u=>
  `<div class="logo"><svg width="200" height="200" viewBox="0 0 200 200"><defs>${G(u+'o',['#ff1f2d','#ff8a00','#ffd21a','#22b800','#00b5ff','#3b2bff','#9b30f0'],.1,0,.9,1)}</defs>
   <g class="spin"><circle cx="100" cy="100" r="92" fill="url(#${u}o)"/>
   <path class="sh dr" pathLength="1" d="M100 14 C40 30 20 110 90 118 C150 124 150 60 100 62 C70 64 66 98 96 100" transform="translate(9 11)" fill="none" stroke="#2a10b0" stroke-opacity=".28" stroke-width="22" stroke-linecap="round"/>
   <path class="sw dr" pathLength="1" d="M100 14 C40 30 20 110 90 118 C150 124 150 60 100 62 C70 64 66 98 96 100" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="20" stroke-linecap="round"/></g></svg>
   ${W('Kosmographica',{cls:'geo',style:'font-size:52px;margin-top:10px'})}</div>`,
r=>{
  an(Q(r,'.spin'),[{transform:'scale(0) rotate(-270deg)',opacity:0},{transform:'scale(1) rotate(0)',opacity:1}],{d:1400,e:E.out});
  draw(Q(r,'.sh'),500,1200,E.out);draw(Q(r,'.sw'),400,1200,E.out);
  rise(QA(r,'.c'),1000,40);
});

/* ---------- 61 Layered K ---------- */
add(61,'Echo K','Trail slide · layered stagger',u=>{

  `<div class="logo"><div class="wrap62">${W('Kosmographica',{cls:'it'})}
   <svg class="orb" viewBox="0 0 600 220" preserveAspectRatio="none"><defs>${G(u+'e',RB,20,0,580,0,'userSpaceOnUse')}</defs>
   <g transform="rotate(-9 300 110)">
    <path class="e1" pathLength="1" d="M20 110 A280 100 0 1 1 580 110 A280 100 0 1 1 20 110" fill="none" stroke="url(#${u}e)" stroke-width="7" stroke-linecap="round" style="stroke-dasharray:.92 2;vector-effect:non-scaling-stroke"/>
    <path class="e2" pathLength="1" d="M60 120 A240 80 0 1 0 540 120 A240 80 0 1 0 60 120" fill="none" stroke="url(#${u}e)" stroke-width="2" stroke-opacity=".6" style="stroke-dasharray:.5 2;vector-effect:non-scaling-stroke"/></g></svg></div></div>`,

  an(Q(r,'.e1'),[{strokeDashoffset:.92,opacity:0},{opacity:1,offset:.05},{strokeDashoffset:0,opacity:1}],{d:1700,e:E.io});
  an(Q(r,'.e2'),[{strokeDashoffset:.5,opacity:0},{opacity:1,offset:.05},{strokeDashoffset:0,opacity:1}],{d:1900,t:200,e:E.io});
  an(Q(r,'.word'),[{opacity:0,filter:'blur(16px)',transform:'scale(1.18)'},{opacity:1,filter:'blur(0)',transform:'none'}],{d:1200,t:500});
});

/* ---------- 63 Tile K ---------- */
add(63,'Tile K','Tile pop · spring rotation',u=>
  `<div class="logo"><svg width="170" height="196" viewBox="0 0 200 230">
   <rect class="st" x="0" y="0" width="56" height="96" fill="#0d0d10"/><rect class="st" x="0" y="138" width="56" height="92" fill="#0d0d10"/>
   <rect class="tl" x="0" y="96" width="56" height="42" fill="#ffd21a"/>

LOGOS.sort((a,b)=>a.n-b.n);

const nav=document.getElementById('nav'),stage=document.getElementById('stage'),cap=document.getElementById('cap');
const playB=document.getElementById('play'),scrub=document.getElementById('scrub'),timeL=document.getElementById('time');
const loopC=document.getElementById('loop'),speedS=document.getElementById('speed');
let cur=0,total=1,playing=true,speed=1;

function fit(el,box,wf,hf,max=2.4){
  el.style.transform='none';
  const w=el.offsetWidth,h=el.offsetHeight;
  const s=Math.min(box.clientWidth*wf/w,box.clientHeight*hf/h,max);
  el.style.transform=`translate(-50%,-50%) scale(${s})`;
}
nav.querySelector('h1').textContent=`Kosmographica · ${LOGOS.length} reveals`;
const thumbs=[];
LOGOS.forEach((L,i)=>{
  const b=document.createElement('button');b.className='item';
  b.innerHTML=`<div class="thumb"></div><div><b><i>${L.label||L.n}</i>${L.name}</b><small>${L.reveal}</small></div>`;
  b.onclick=()=>show(i);nav.appendChild(b);
  const th=b.querySelector('.thumb');
  const el=mk(L.build('t'+L.n));th.appendChild(el);layoutWords(el);thumbs.push([el,th]);
  anims=[];L.play(el);anims.forEach(a=>a.finish()); // thumbnail = final frame
});
anims=[];
function fitThumbs(){thumbs.forEach(([el,th])=>fit(el,th,.86,.8,1))}

function show(i){
  cur=(i+LOGOS.length)%LOGOS.length;
  const L=LOGOS[cur];
  [...nav.querySelectorAll('.item')].forEach((b,k)=>b.classList.toggle('on',k===cur));
  nav.querySelectorAll('.item')[cur].scrollIntoView({block:'nearest'});
  stage.querySelectorAll('.logo').forEach(n=>n.remove());
  const el=mk(L.build('s'+L.n));stage.appendChild(el);layoutWords(el);
  fit(el,stage,.72,.62);
  cap.innerHTML=`<b>${L.label||L.n}</b> · ${L.name} — ${L.reveal}`;
  anims=[];L.play(el);
  total=Math.max(1,...anims.map(a=>a.effect.getComputedTiming().endTime));
  anims.forEach(a=>{a.playbackRate=speed});
  playing=true;playB.textContent='Pause';
}
function pauseAll(){anims.forEach(a=>a.pause());playing=false;playB.textContent='Play'}
playB.onclick=()=>{
  if(playing){pauseAll();return}
  const t=anims[0]?anims[0].currentTime:0;
  if(t>=total-5){show(cur);return}
  anims.forEach(a=>a.play());playing=true;playB.textContent='Pause';
};
document.getElementById('replay').onclick=()=>show(cur);
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
speedS.onchange=()=>{speed=+speedS.value;anims.forEach(a=>{a.playbackRate=speed})};
scrub.oninput=()=>{pauseAll();const t=scrub.value/1000*total;anims.forEach(a=>{a.currentTime=t})};
addEventListener('keydown',e=>{
  if(e.target.matches('input,select'))return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){show(cur+1);e.preventDefault()}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){show(cur-1);e.preventDefault()}
  else if(e.key==='r'||e.key==='R')show(cur);
  else if(e.key===' '){playB.click();e.preventDefault()}
});
addEventListener('resize',()=>{fitThumbs();const el=stage.querySelector('.logo');if(el)fit(el,stage,.72,.62)});

let loopWait=0;
(function tick(){
  const a=anims[0];
  if(a){
    const t=Math.min(a.currentTime||0,total);
    if(playing)scrub.value=t/total*1000;
    timeL.textContent=`${(t/1000).toFixed(2)} / ${(total/1000).toFixed(2)}s`;
    if(playing&&t>=total-5){
      if(loopC.checked){loopWait++;if(loopWait>70){loopWait=0;show(cur)}}
      else{playing=false;playB.textContent='Replay'}
    }else loopWait=0;
  }
  requestAnimationFrame(tick);
})();

(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{fitThumbs();show(0)});
if(document.fonts)document.fonts.addEventListener('loadingdone',()=>{fitThumbs();const el=stage.querySelector('.logo');if(el)fit(el,stage,.72,.62)});
setTimeout(()=>{if(!anims.length){fitThumbs();show(0)}},2500);
</script>
